# Release: push a tag vX.Y.Z on main. GoReleaser builds the static binaries
# (linux amd64 + arm64) and uploads them with checksums.txt to the GitHub release.
#
# GO_VERSION is pinned so the binaries are reproducible: `make checksums
# VERSION=X.Y.Z` with this Go version prints the same SHA-256 values. After a
# release, compare checksums.txt with the pins of every consumer (the Grow
# platform pins version + SHA-256 in managed-stack-secrets-exec.ts).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.8"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: test
        run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: show checksums
        run: cat dist/checksums.txt
